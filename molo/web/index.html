<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Molo</title>
<meta name="theme-color" content="#16171A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<!-- ?v= changes with each release. Without it a browser that has seen Molo
     before keeps using the old stylesheet after an update. -->
<link rel="stylesheet" href="/static/app.css?v=1.0.0">
</head>
<body>

<!-- A very faint grain over everything. Flat dark surfaces band on wide
     gamut displays and read as cheap; a little noise breaks that up. -->
<div class="grain" aria-hidden="true"></div>

<div id="gate" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="sheet-card">
    <div class="sheet-mark">
      <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
          <rect x="14.5" y="4.6" width="3" height="9.4" rx="1.4"/>
          <path d="M10.4 12.4h11.2L16 19.4z"/>
          <rect x="4.6" y="21.1" width="22.8" height="3" rx="1.5"/>
          <rect x="9.3" y="23.9" width="2.6" height="4.8" rx="1.3"/>
          <rect x="20.1" y="23.9" width="2.6" height="4.8" rx="1.3"/>
        </svg>
    </div>
    <h1 id="gate-title" data-i18n="gate.title">Molo</h1>
    <p class="lead" data-i18n="gate.lead"></p>
    <ol class="terms">
      <li><b data-i18n="gate.p1.b"></b> <span data-i18n="gate.p1"></span></li>
      <li><b data-i18n="gate.p2.b"></b> <span data-i18n="gate.p2"></span></li>
      <li><b data-i18n="gate.p3.b"></b> <span data-i18n="gate.p3"></span></li>
    </ol>
    <button id="gate-accept" class="btn primary wide" data-i18n="gate.accept"></button>
    <a class="sheet-link" href="https://github.com/nerln/molo/blob/master/LEGAL.md"
       target="_blank" rel="noopener" data-i18n="gate.more"></a>
  </div>
</div>

<div id="shortcuts" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shortcuts-title">
  <div class="sheet-card narrow">
    <h2 id="shortcuts-title" class="sheet-title" data-i18n="shortcuts.title"></h2>
    <dl class="keys">
      <dt><kbd>⌘</kbd><kbd>,</kbd></dt><dd data-i18n="shortcuts.settings"></dd>
      <dt><kbd>⌘</kbd><kbd>V</kbd></dt><dd data-i18n="shortcuts.paste"></dd>
      <dt><kbd>⌘</kbd><kbd>L</kbd></dt><dd data-i18n="shortcuts.focus"></dd>
      <dt><kbd>⌘</kbd><kbd>1</kbd></dt><dd data-i18n="shortcuts.queue"></dd>
      <dt><kbd>⌘</kbd><kbd>2</kbd></dt><dd data-i18n="shortcuts.watchers"></dd>
      <dt><kbd>⌘</kbd><kbd>/</kbd></dt><dd data-i18n="shortcuts.help"></dd>
    </dl>
    <button class="btn quiet wide" data-close-sheet data-i18n="shortcuts.close"></button>
  </div>
</div>

<div class="shell">

  <aside class="rail">
    <div class="rail-head">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
          <rect x="14.5" y="4.6" width="3" height="9.4" rx="1.4"/>
          <path d="M10.4 12.4h11.2L16 19.4z"/>
          <rect x="4.6" y="21.1" width="22.8" height="3" rx="1.5"/>
          <rect x="9.3" y="23.9" width="2.6" height="4.8" rx="1.3"/>
          <rect x="20.1" y="23.9" width="2.6" height="4.8" rx="1.3"/>
        </svg>
      </span>
      <span class="wordmark">Molo</span>
    </div>

    <nav class="nav">
      <button class="nav-item is-active" data-tab="queue" data-i18n-aria="nav.queue">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M8 10.5 4.8 7.3M8 10.5l3.2-3.2M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="nav.queue"></span>
        <b class="count" id="count-queue"></b>
      </button>
      <button class="nav-item" data-tab="watchers" data-i18n-aria="nav.watchers">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 5.2V8l1.9 1.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span data-i18n="nav.watchers"></span>
        <b class="count" id="count-watch"></b>
      </button>
      <button class="nav-item" data-tab="settings" data-i18n-aria="nav.settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 11.5h11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="4.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="10.5" cy="11.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span data-i18n="nav.settings"></span>
        <kbd class="nav-key">⌘,</kbd>
      </button>
    </nav>

    <div class="rail-foot">
      <div class="stat"><span data-i18n="status.engine"></span><b id="pill-ytdlp">—</b></div>
      <div class="stat" id="stat-ffmpeg"><span data-i18n="status.ffmpeg"></span><b id="pill-ffmpeg">—</b></div>
      <div class="stat" id="pill-lan" hidden><span data-i18n="status.network"></span><b data-i18n="status.reachable"></b></div>
    </div>
  </aside>

  <main class="content">
    <div class="scroll" id="scroll">

      <section id="tab-queue" class="view">
        <div class="composer" id="composer">
          <div class="composer-row">
            <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                   data-i18n-placeholder="composer.placeholder">
            <button id="add" class="btn primary" data-i18n="composer.button"></button>
          </div>
          <div class="composer-meta">
            <select id="preset" data-i18n-aria="composer.button"></select>
            <p class="hint" id="preset-hint"></p>
          </div>
          <div id="preview" class="preview" hidden></div>
          <!-- The label matters. Without it this reads as a link that
               appeared from nowhere, which is what the first tester saw. -->
          <div id="suggestion" class="suggestion" hidden>
            <svg class="sugg-icon" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="4.5" y="2.5" width="9" height="11" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
              <path d="M10.5 2.5V4a.5.5 0 0 1-.5.5H8a.5.5 0 0 1-.5-.5V2.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
              <path d="M4.5 5H3a1 1 0 0 0-1 1v6.5a1 1 0 0 0 1 1h6" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".55"/>
            </svg>
            <span class="sugg-text">
              <span class="sugg-label" data-i18n="composer.clipboard"></span>
              <b id="sugg-url"></b>
            </span>
            <span class="sugg-actions">
              <button class="btn quiet tiny" id="sugg-add" data-i18n="composer.button"></button>
              <button class="btn ghost tiny" id="sugg-no" data-i18n-aria="composer.dismiss">✕</button>
            </span>
          </div>
          <div class="drop-hint" data-i18n="composer.drop"></div>
        </div>

        <!-- Persistent, not a toast. A missing dependency is a state, and a
             state that scrolls away after five seconds reads like a glitch. -->
        <div id="ffmpeg-notice" class="notice" hidden>
          <div class="notice-body">
            <b data-i18n="ffmpeg.missing.title"></b>
            <p data-i18n="ffmpeg.missing.body"></p>
            <p class="notice-cmd"><span data-i18n="ffmpeg.missing.how"></span> <code id="ffmpeg-cmd">brew install ffmpeg</code></p>
          </div>
        </div>

        <div id="active" class="active" hidden></div>

        <div class="list-head" id="list-head" hidden>
          <h2 class="group" id="list-title"></h2>
          <button class="btn ghost tiny" id="clear" data-i18n="queue.clear"></button>
        </div>
        <div id="jobs" class="jobs"></div>

        <div class="empty" id="empty-jobs">
          <div class="empty-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="currentColor">
              <rect x="14.5" y="4.6" width="3" height="9.4" rx="1.4"/>
              <path d="M10.4 12.4h11.2L16 19.4z"/>
              <rect x="4.6" y="21.1" width="22.8" height="3" rx="1.5"/>
              <rect x="9.3" y="23.9" width="2.6" height="4.8" rx="1.3"/>
              <rect x="20.1" y="23.9" width="2.6" height="4.8" rx="1.3"/>
            </svg>
          </div>
          <p class="empty-title" data-i18n="queue.empty.title"></p>
          <p class="empty-body" data-i18n="queue.empty.body"></p>
        </div>
      </section>

      <section id="tab-watchers" class="view" hidden>
        <p class="explain" data-i18n="watch.explain"></p>
        <div class="composer">
          <div class="composer-row">
            <input id="watch-url" type="url" data-i18n-placeholder="watch.placeholder">
            <button id="watch-add" class="btn primary" data-i18n="watch.add"></button>
          </div>
          <div class="composer-meta">
            <select id="watch-interval">
              <option value="30" data-i18n="watch.every30"></option>
              <option value="60" selected data-i18n="watch.every60"></option>
              <option value="360" data-i18n="watch.every360"></option>
              <option value="1440" data-i18n="watch.every1440"></option>
            </select>
          </div>
        </div>
        <div id="watchers" class="watchers"></div>
      </section>

      <section id="tab-settings" class="view" hidden>

        <h2 class="group" data-i18n="settings.destination"></h2>
        <div class="field-row">
          <input id="download-dir" type="text" spellcheck="false">
          <button class="btn quiet" id="reveal" data-i18n="settings.open"></button>
        </div>

        <h2 class="group" data-i18n="settings.downloads"></h2>
        <label class="line">
          <span class="line-label"><span data-i18n="settings.parallel"></span><em data-i18n="settings.parallelHint"></em></span>
          <input id="concurrent" type="number" min="1" max="6" class="stepper">
        </label>
        <label class="line"><span class="line-label" data-i18n="settings.metadata"></span><input type="checkbox" id="embed_metadata"></label>
        <label class="line"><span class="line-label" data-i18n="settings.thumbnail"></span><input type="checkbox" id="embed_thumbnail"></label>
        <label class="line"><span class="line-label" data-i18n="settings.subs"></span><input type="checkbox" id="embed_subs"></label>
        <label class="line"><span class="line-label"><span data-i18n="settings.archive"></span><em data-i18n="settings.archiveHint"></em></span><input type="checkbox" id="write_archive"></label>

        <h2 class="group" data-i18n="settings.automatic"></h2>
        <label class="line"><span class="line-label"><span data-i18n="settings.autoUpdate"></span><em data-i18n="settings.autoUpdateHint"></em></span><input type="checkbox" id="auto_update_ytdlp"></label>
        <label class="line"><span class="line-label" data-i18n="settings.clipboard"></span><input type="checkbox" id="watch_clipboard"></label>

        <h2 class="group" data-i18n="settings.network"></h2>
        <label class="line"><span class="line-label"><span data-i18n="settings.lan"></span><em data-i18n="settings.lanHint"></em></span><input type="checkbox" id="allow_lan"></label>
        <div id="pairing" class="pairing" hidden>
          <code id="pair-url"></code>
          <button class="btn quiet tiny" id="copy-pair" data-i18n="settings.copy"></button>
        </div>

        <h2 class="group" data-i18n="settings.access"></h2>
        <label class="line">
          <span class="line-label"><span data-i18n="settings.cookies"></span><em data-i18n="settings.cookiesHint"></em></span>
          <select id="cookies_from_browser"></select>
        </label>

        <h2 class="group" data-i18n="settings.language"></h2>
        <div class="field-row">
          <select id="language"></select>
        </div>

        <h2 class="group" data-i18n="settings.engine"></h2>
        <div class="field-row">
          <button class="btn quiet" id="update-ytdlp" data-i18n="settings.updateNow"></button>
          <span class="hint" id="update-msg"></span>
        </div>

        <footer class="colophon">
          Molo v<span id="version">—</span> · MIT ·
          <a href="https://github.com/nerln/molo" target="_blank" rel="noopener">source</a> ·
          <a href="https://github.com/yt-dlp/yt-dlp" target="_blank" rel="noopener">yt-dlp</a> ·
          <a href="https://github.com/nerln/molo/blob/master/LEGAL.md" target="_blank" rel="noopener">legal</a>
        </footer>
      </section>

    </div>
  </main>
</div>

<!-- polite by default; errors are re-announced assertively in openSheet's
     sibling, toast(), which swaps the live setting per message. -->
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<script src="/static/i18n.js?v=1.0.0"></script>
<script src="/static/app.js?v=1.0.0"></script>
</body>
</html>
